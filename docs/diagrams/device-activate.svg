<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" role="img">
<title>Paying moves the device</title>
<desc>A paid activation looks for the MAC in devices first; if already there it is returned as is. Otherwise it looks in pendingDevices; if missing it returns devices.not_found. If found, the device is moved in one transaction: inserted into devices with the same id and key, and deleted from pendingDevices.</desc>
<style>
.bg{fill:#ffffff}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#2c2c2a}
.ts{font-size:12px;fill:#5f5e5a}
.box rect{fill:#f1efe8;stroke:#b4b2a9}
.amber rect{fill:#FAEEDA;stroke:#854F0B}.amber .t{fill:#633806}.amber .ts{fill:#854F0B}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .t{fill:#085041}.teal .ts{fill:#0F6E56}
.arr{stroke:#888780;stroke-width:1.5;fill:none}

.bg{fill:#1f1e1d}.t{fill:#f1efe8}.ts{fill:#b4b2a9}
.box rect{fill:#2c2c2a;stroke:#5f5e5a}
.amber rect{fill:#633806;stroke:#EF9F27}.amber .t{fill:#FAEEDA}.amber .ts{fill:#FAC775}
.teal rect{fill:#085041;stroke:#5DCAA5}.teal .t{fill:#E1F5EE}.teal .ts{fill:#9FE1CB}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="430" rx="12"/>
<g class="box"><rect x="310" y="30" width="240" height="56" rx="8" stroke-width="0.8"/>
<text class="t" x="430" y="50" text-anchor="middle" dominant-baseline="central">Paid activation</text>
<text class="ts" x="430" y="68" text-anchor="middle" dominant-baseline="central">Payment, code, admin, store</text></g>
<line class="arr" x1="430" y1="86" x2="430" y2="112" marker-end="url(#a)"/>
<g class="teal"><rect x="310" y="116" width="240" height="44" rx="8" stroke-width="0.8"/>
<text class="t" x="430" y="138" text-anchor="middle" dominant-baseline="central">In devices?</text></g>
<line class="arr" x1="310" y1="138" x2="244" y2="138" marker-end="url(#a)"/>
<text class="ts" x="277" y="128" text-anchor="middle">Yes</text>
<g class="teal"><rect x="40" y="116" width="200" height="44" rx="8" stroke-width="0.8"/>
<text class="t" x="140" y="138" text-anchor="middle" dominant-baseline="central">Already paid: return it</text></g>
<line class="arr" x1="430" y1="160" x2="430" y2="188" marker-end="url(#a)"/>
<text class="ts" x="440" y="179">No</text>
<g class="amber"><rect x="310" y="192" width="240" height="44" rx="8" stroke-width="0.8"/>
<text class="t" x="430" y="214" text-anchor="middle" dominant-baseline="central">In pendingDevices?</text></g>
<line class="arr" x1="310" y1="214" x2="244" y2="214" marker-end="url(#a)"/>
<text class="ts" x="277" y="204" text-anchor="middle">No</text>
<g class="box"><rect x="40" y="192" width="200" height="44" rx="8" stroke-width="0.8"/>
<text class="t" x="140" y="214" text-anchor="middle" dominant-baseline="central">devices.not_found</text></g>
<line class="arr" x1="430" y1="236" x2="430" y2="264" marker-end="url(#a)"/>
<text class="ts" x="440" y="255">Yes</text>
<g class="teal"><rect x="290" y="268" width="280" height="56" rx="8" stroke-width="0.8"/>
<text class="t" x="430" y="288" text-anchor="middle" dominant-baseline="central">Move in one transaction</text>
<text class="ts" x="430" y="306" text-anchor="middle" dominant-baseline="central">Insert into devices, delete from pending</text></g>
<line class="arr" x1="430" y1="324" x2="430" y2="350" marker-end="url(#a)"/>
<g class="teal"><rect x="310" y="354" width="240" height="44" rx="8" stroke-width="0.8"/>
<text class="t" x="430" y="376" text-anchor="middle" dominant-baseline="central">Return paid device</text></g>
<text class="ts" x="40" y="300">Same id and device key</text>
<text class="ts" x="40" y="318">before and after the move</text>
</svg>
