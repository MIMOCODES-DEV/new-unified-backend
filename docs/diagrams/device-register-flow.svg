<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="680" height="540" role="img">
<title>Register-or-get flow</title>
<desc>A request with a MAC and app type is normalized and validated, looked up first in devices (paid), then in pendingDevices (not paid). A device found in either is returned after recording the visit. A device found in neither is inserted into pendingDevices with a new 7-day trial; a device key collision retries with a new key and a MAC collision reuses the record another request just created.</desc>
<style>
.bg{fill:#ffffff}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#2c2c2a}
.ts{font-size:12px;fill:#5f5e5a}
.box rect{fill:#f1efe8;stroke:#b4b2a9}
.amber rect{fill:#FAEEDA;stroke:#854F0B}.amber .t{fill:#633806}.amber .ts{fill:#854F0B}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .t{fill:#085041}.teal .ts{fill:#0F6E56}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.sw-a{fill:#FAEEDA;stroke:#854F0B}.sw-t{fill:#E1F5EE;stroke:#0F6E56}

.bg{fill:#1f1e1d}.t{fill:#f1efe8}.ts{fill:#b4b2a9}
.box rect{fill:#2c2c2a;stroke:#5f5e5a}
.amber rect{fill:#633806;stroke:#EF9F27}.amber .t{fill:#FAEEDA}.amber .ts{fill:#FAC775}
.teal rect{fill:#085041;stroke:#5DCAA5}.teal .t{fill:#E1F5EE}.teal .ts{fill:#9FE1CB}
.sw-a{fill:#633806;stroke:#EF9F27}.sw-t{fill:#085041;stroke:#5DCAA5}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="540" rx="12"/>
<g class="box"><rect x="310" y="30" width="240" height="44" rx="8" stroke-width="0.8"/>
<text class="t" x="430" y="52" text-anchor="middle" dominant-baseline="central">MAC + app type</text></g>
<line class="arr" x1="430" y1="74" x2="430" y2="96" marker-end="url(#a)"/>
<g class="box"><rect x="310" y="100" width="240" height="56" rx="8" stroke-width="0.8"/>
<text class="t" x="430" y="120" text-anchor="middle" dominant-baseline="central">Normalize and validate</text>
<text class="ts" x="430" y="138" text-anchor="middle" dominant-baseline="central">Invalid: return error</text></g>
<line class="arr" x1="430" y1="156" x2="430" y2="182" marker-end="url(#a)"/>
<g class="teal"><rect x="310" y="186" width="240" height="44" rx="8" stroke-width="0.8"/>
<text class="t" x="430" y="208" text-anchor="middle" dominant-baseline="central">Look in devices</text></g>
<line class="arr" x1="430" y1="230" x2="430" y2="258" marker-end="url(#a)"/>
<text class="ts" x="440" y="249">Not found</text>
<g class="amber"><rect x="310" y="262" width="240" height="44" rx="8" stroke-width="0.8"/>
<text class="t" x="430" y="284" text-anchor="middle" dominant-baseline="central">Look in pendingDevices</text></g>
<line class="arr" x1="430" y1="306" x2="430" y2="334" marker-end="url(#a)"/>
<text class="ts" x="440" y="325">Not found</text>
<g class="amber"><rect x="310" y="338" width="240" height="56" rx="8" stroke-width="0.8"/>
<text class="t" x="430" y="358" text-anchor="middle" dominant-baseline="central">Insert into pendingDevices</text>
<text class="ts" x="430" y="376" text-anchor="middle" dominant-baseline="central">New 7-day trial, 6-digit key</text></g>
<line class="arr" x1="430" y1="394" x2="430" y2="420" marker-end="url(#a)"/>
<g class="amber"><rect x="310" y="424" width="240" height="56" rx="8" stroke-width="0.8"/>
<text class="t" x="430" y="444" text-anchor="middle" dominant-baseline="central">Duplicate?</text>
<text class="ts" x="430" y="462" text-anchor="middle" dominant-baseline="central">Key: retry · MAC: use winner</text></g>
<g class="box"><rect x="40" y="186" width="200" height="120" rx="8" stroke-width="0.8"/>
<text class="t" x="140" y="236" text-anchor="middle" dominant-baseline="central">Return device</text>
<text class="ts" x="140" y="256" text-anchor="middle" dominant-baseline="central">Record visit</text></g>
<line class="arr" x1="310" y1="208" x2="244" y2="208" marker-end="url(#a)"/>
<text class="ts" x="277" y="198" text-anchor="middle">Found</text>
<line class="arr" x1="310" y1="284" x2="244" y2="284" marker-end="url(#a)"/>
<text class="ts" x="277" y="274" text-anchor="middle">Found</text>
<path class="arr" d="M310 452 L140 452 L140 310" marker-end="url(#a)"/>
<text class="ts" x="225" y="442" text-anchor="middle">Created</text>
<rect class="sw-t" x="40" y="508" width="12" height="12" rx="2" stroke-width="0.8"/>
<text class="ts" x="58" y="518">devices (paid)</text>
<rect class="sw-a" x="170" y="508" width="12" height="12" rx="2" stroke-width="0.8"/>
<text class="ts" x="188" y="518">pendingDevices (not paid)</text>
</svg>
