<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" width="680" height="350" role="img">
<title>Device states</title>
<desc>An unknown MAC enters pendingDevices on a 7-day trial. After 7 days the trial expires but the record stays. Paying at any point moves the device into devices as a real user. Quarantine comes in a later slice.</desc>
<style>
.bg{fill:#ffffff}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#2c2c2a}
.ts{font-size:12px;fill:#5f5e5a}
.box rect{fill:#f1efe8;stroke:#b4b2a9}
.amber rect{fill:#FAEEDA;stroke:#854F0B}.amber .t{fill:#633806}.amber .ts{fill:#854F0B}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .t{fill:#085041}.teal .ts{fill:#0F6E56}
.coral rect{fill:#FAECE7;stroke:#993C1D}.coral .t{fill:#712B13}.coral .ts{fill:#993C1D}
.grp{fill:none;stroke:#b4b2a9;stroke-dasharray:4 3}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
.sw-a{fill:#FAEEDA;stroke:#854F0B}.sw-t{fill:#E1F5EE;stroke:#0F6E56}

.bg{fill:#1f1e1d}.t{fill:#f1efe8}.ts{fill:#b4b2a9}
.box rect{fill:#2c2c2a;stroke:#5f5e5a}
.amber rect{fill:#633806;stroke:#EF9F27}.amber .t{fill:#FAEEDA}.amber .ts{fill:#FAC775}
.teal rect{fill:#085041;stroke:#5DCAA5}.teal .t{fill:#E1F5EE}.teal .ts{fill:#9FE1CB}
.coral rect{fill:#712B13;stroke:#F0997B}.coral .t{fill:#FAECE7}.coral .ts{fill:#F5C4B3}
.grp{stroke:#5f5e5a}
.sw-a{fill:#633806;stroke:#EF9F27}.sw-t{fill:#085041;stroke:#5DCAA5}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="350" rx="12"/>
<rect class="grp" x="200" y="30" width="210" height="250" rx="12" stroke-width="0.8"/>
<text class="ts" x="214" y="50">pendingDevices · not paid</text>
<rect class="grp" x="450" y="30" width="190" height="250" rx="12" stroke-width="0.8"/>
<text class="ts" x="464" y="50">devices · paid only</text>
<g class="box"><rect x="30" y="76" width="140" height="56" rx="8" stroke-width="0.8"/>
<text class="t" x="100" y="96" text-anchor="middle" dominant-baseline="central">Unknown MAC</text>
<text class="ts" x="100" y="114" text-anchor="middle" dominant-baseline="central">First visit</text></g>
<line class="arr" x1="170" y1="104" x2="216" y2="104" marker-end="url(#a)"/>
<g class="amber"><rect x="220" y="76" width="170" height="56" rx="8" stroke-width="0.8"/>
<text class="t" x="305" y="96" text-anchor="middle" dominant-baseline="central">Trial device</text>
<text class="ts" x="305" y="114" text-anchor="middle" dominant-baseline="central">Trial 7 days</text></g>
<line class="arr" x1="305" y1="132" x2="305" y2="196" marker-end="url(#a)"/>
<text class="ts" x="315" y="168">7 days pass</text>
<g class="amber"><rect x="220" y="200" width="170" height="56" rx="8" stroke-width="0.8"/>
<text class="t" x="305" y="220" text-anchor="middle" dominant-baseline="central">Trial expired</text>
<text class="ts" x="305" y="238" text-anchor="middle" dominant-baseline="central">Kept, must pay</text></g>
<line class="arr" x1="390" y1="104" x2="466" y2="104" marker-end="url(#a)"/>
<text class="ts" x="430" y="94" text-anchor="middle">Pays</text>
<path class="arr" d="M390 228 L430 228 L430 122 L466 122" marker-end="url(#a)"/>
<g class="teal"><rect x="470" y="76" width="150" height="56" rx="8" stroke-width="0.8"/>
<text class="t" x="545" y="96" text-anchor="middle" dominant-baseline="central">Real user</text>
<text class="ts" x="545" y="114" text-anchor="middle" dominant-baseline="central">Paid device</text></g>
<line class="arr" x1="545" y1="132" x2="545" y2="196" stroke-dasharray="4 3" marker-end="url(#a)"/>
<g class="coral"><rect x="470" y="200" width="150" height="56" rx="8" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="t" x="545" y="220" text-anchor="middle" dominant-baseline="central">Quarantined</text>
<text class="ts" x="545" y="238" text-anchor="middle" dominant-baseline="central">Later slice</text></g>
<rect class="sw-a" x="30" y="306" width="12" height="12" rx="2" stroke-width="0.8"/>
<text class="ts" x="48" y="316">Not paid, never removed</text>
<rect class="sw-t" x="210" y="306" width="12" height="12" rx="2" stroke-width="0.8"/>
<text class="ts" x="228" y="316">Paid</text>
<line x1="280" y1="312" x2="310" y2="312" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"/>
<text class="ts" x="318" y="316">Dashed box = collection · dashed line = later</text>
</svg>
