<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 650" width="680" height="650" role="img">
<title>Devices module as built</title>
<desc>Two CLI commands call the two use cases. The use cases depend on ports and on the domain. MongoDeviceRepository and RandomDeviceKeyGenerator implement the ports. The repository stores devices in the brand database: pendingDevices for unpaid devices and devices for paid ones, with the move done in one transaction.</desc>
<style>
.bg{fill:#ffffff}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#2c2c2a}
.ts{font-size:12px;fill:#5f5e5a}
.box rect{fill:#f1efe8;stroke:#b4b2a9}
.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .t{fill:#3C3489}.purple .ts{fill:#534AB7}
.amber rect{fill:#FAEEDA;stroke:#854F0B}.amber .t{fill:#633806}.amber .ts{fill:#854F0B}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .t{fill:#085041}.teal .ts{fill:#0F6E56}
.grp{fill:none;stroke:#b4b2a9;stroke-dasharray:4 3}
.arr{stroke:#888780;stroke-width:1.5;fill:none}

.bg{fill:#1f1e1d}.t{fill:#f1efe8}.ts{fill:#b4b2a9}
.box rect{fill:#2c2c2a;stroke:#5f5e5a}
.purple rect{fill:#3C3489;stroke:#AFA9EC}.purple .t{fill:#EEEDFE}.purple .ts{fill:#CECBF6}
.amber rect{fill:#633806;stroke:#EF9F27}.amber .t{fill:#FAEEDA}.amber .ts{fill:#FAC775}
.teal rect{fill:#085041;stroke:#5DCAA5}.teal .t{fill:#E1F5EE}.teal .ts{fill:#9FE1CB}
.grp{stroke:#5f5e5a}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="650" rx="12"/>
<g class="box"><rect x="95" y="30" width="200" height="44" rx="8" stroke-width="0.8"/>
<text class="t" x="195" y="52" text-anchor="middle" dominant-baseline="central">cli device:register</text></g>
<g class="box"><rect x="385" y="30" width="200" height="44" rx="8" stroke-width="0.8"/>
<text class="t" x="485" y="52" text-anchor="middle" dominant-baseline="central">cli device:activate</text></g>
<line class="arr" x1="195" y1="74" x2="195" y2="126" marker-end="url(#a)"/>
<line class="arr" x1="485" y1="74" x2="485" y2="126" marker-end="url(#a)"/>
<rect class="grp" x="40" y="100" width="600" height="200" rx="12" stroke-width="0.8"/>
<text class="ts" x="56" y="118">src/modules/devices</text>
<g class="purple"><rect x="60" y="130" width="270" height="56" rx="8" stroke-width="0.8"/>
<text class="t" x="195" y="150" text-anchor="middle" dominant-baseline="central">RegisterOrGetDeviceUseCase</text>
<text class="ts" x="195" y="168" text-anchor="middle" dominant-baseline="central">Paid, else pending, else new trial</text></g>
<g class="purple"><rect x="350" y="130" width="270" height="56" rx="8" stroke-width="0.8"/>
<text class="t" x="485" y="150" text-anchor="middle" dominant-baseline="central">ActivateDeviceUseCase</text>
<text class="ts" x="485" y="168" text-anchor="middle" dominant-baseline="central">Only way into devices</text></g>
<line class="arr" x1="195" y1="186" x2="195" y2="222" marker-end="url(#a)"/>
<line class="arr" x1="400" y1="186" x2="400" y2="222" marker-end="url(#a)"/>
<g class="purple"><rect x="60" y="226" width="360" height="56" rx="8" stroke-width="0.8"/>
<text class="t" x="240" y="246" text-anchor="middle" dominant-baseline="central">Ports</text>
<text class="ts" x="240" y="264" text-anchor="middle" dominant-baseline="central">DeviceRepository · DeviceKeyGenerator</text></g>
<g class="purple"><rect x="440" y="226" width="180" height="56" rx="8" stroke-width="0.8"/>
<text class="t" x="530" y="246" text-anchor="middle" dominant-baseline="central">Domain</text>
<text class="ts" x="530" y="264" text-anchor="middle" dominant-baseline="central">Device, AppType</text></g>
<text class="ts" x="40" y="590">Device: pending or paid · 7-day trial · unique 6-digit key</text>
<text class="ts" x="40" y="610">Tests: 28 unit (in-memory fake with race hooks) · 7 integration on MongoDB</text>
<text class="ts" x="40" y="630">Migration 0001-devices-indexes: unique MAC + unique key, both collections</text>
<g class="box"><rect x="60" y="330" width="270" height="56" rx="8" stroke-width="0.8"/>
<text class="t" x="195" y="350" text-anchor="middle" dominant-baseline="central">MongoDeviceRepository</text>
<text class="ts" x="195" y="368" text-anchor="middle" dominant-baseline="central">Via TenantDb, brand's own DB</text></g>
<g class="box"><rect x="350" y="330" width="270" height="56" rx="8" stroke-width="0.8"/>
<text class="t" x="485" y="350" text-anchor="middle" dominant-baseline="central">RandomDeviceKeyGenerator</text>
<text class="ts" x="485" y="368" text-anchor="middle" dominant-baseline="central">6 digits, 100000 to 999999</text></g>
<line class="arr" x1="195" y1="330" x2="195" y2="286" stroke-dasharray="4 3" marker-end="url(#a)"/>
<line class="arr" x1="400" y1="330" x2="400" y2="286" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text class="ts" x="207" y="318">implements</text>
<rect class="grp" x="40" y="420" width="600" height="130" rx="12" stroke-width="0.8"/>
<text class="ts" x="56" y="536">MongoDB · brand database (e.g. cr7)</text>
<g class="amber"><rect x="60" y="440" width="270" height="50" rx="8" stroke-width="0.8"/>
<text class="t" x="195" y="457" text-anchor="middle" dominant-baseline="central">pendingDevices</text>
<text class="ts" x="195" y="475" text-anchor="middle" dominant-baseline="central">Not paid, kept forever</text></g>
<g class="teal"><rect x="350" y="440" width="270" height="50" rx="8" stroke-width="0.8"/>
<text class="t" x="485" y="457" text-anchor="middle" dominant-baseline="central">devices</text>
<text class="ts" x="485" y="475" text-anchor="middle" dominant-baseline="central">Paid only, same id and key</text></g>
<line class="arr" x1="195" y1="386" x2="195" y2="436" marker-end="url(#a)"/>
<path class="arr" d="M300 386 L300 404 L520 404 L520 436" marker-end="url(#a)"/>
<text class="ts" x="410" y="398" text-anchor="middle">Move: one transaction</text>
