<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520" role="img">
<title>Host to brand</title>
<desc>The Host header is normalized and matched exactly against unified_central.tenants. An unknown host gets 421 and a disabled brand gets 403. A found, active brand is stored in the request context, and repositories then use TenantDb to reach that brand's own database.</desc>
<style>
.bg{fill:#ffffff}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.t{font-size:14px;font-weight:500;fill:#2c2c2a}
.ts{font-size:12px;fill:#5f5e5a}
.box rect{fill:#f1efe8;stroke:#b4b2a9}
.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .t{fill:#3C3489}.purple .ts{fill:#534AB7}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .t{fill:#085041}.teal .ts{fill:#0F6E56}
.arr{stroke:#888780;stroke-width:1.5;fill:none}

.bg{fill:#1f1e1d}.t{fill:#f1efe8}.ts{fill:#b4b2a9}
.box rect{fill:#2c2c2a;stroke:#5f5e5a}
.purple rect{fill:#3C3489;stroke:#AFA9EC}.purple .t{fill:#EEEDFE}.purple .ts{fill:#CECBF6}
.teal rect{fill:#085041;stroke:#5DCAA5}.teal .t{fill:#E1F5EE}.teal .ts{fill:#9FE1CB}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" x="0" y="0" width="680" height="520" rx="12"/>
<g class="box"><rect x="310" y="30" width="240" height="56" rx="8" stroke-width="0.8"/>
<text class="t" x="430" y="50" text-anchor="middle" dominant-baseline="central">Request arrives</text>
<text class="ts" x="430" y="68" text-anchor="middle" dominant-baseline="central">Host: CR7Player.com:443</text></g>
<line class="arr" x1="430" y1="86" x2="430" y2="112" marker-end="url(#a)"/>
<g class="purple"><rect x="310" y="116" width="240" height="56" rx="8" stroke-width="0.8"/>
<text class="t" x="430" y="136" text-anchor="middle" dominant-baseline="central">Normalize host</text>
<text class="ts" x="430" y="154" text-anchor="middle" dominant-baseline="central">Lowercase, no port: cr7player.com</text></g>
<line class="arr" x1="430" y1="172" x2="430" y2="198" marker-end="url(#a)"/>
<g class="purple"><rect x="310" y="202" width="240" height="56" rx="8" stroke-width="0.8"/>
<text class="t" x="430" y="222" text-anchor="middle" dominant-baseline="central">Find in tenants</text>
<text class="ts" x="430" y="240" text-anchor="middle" dominant-baseline="central">unified_central, exact match</text></g>
<line class="arr" x1="310" y1="230" x2="244" y2="230" marker-end="url(#a)"/>
<text class="ts" x="277" y="220" text-anchor="middle">Not found</text>
<g class="box"><rect x="40" y="202" width="200" height="56" rx="8" stroke-width="0.8"/>
<text class="t" x="140" y="222" text-anchor="middle" dominant-baseline="central">421 unknown host</text>
<text class="ts" x="140" y="240" text-anchor="middle" dominant-baseline="central">Never a default brand</text></g>
<line class="arr" x1="430" y1="258" x2="430" y2="284" marker-end="url(#a)"/>
<text class="ts" x="440" y="275">Found</text>
<g class="purple"><rect x="310" y="288" width="240" height="44" rx="8" stroke-width="0.8"/>
<text class="t" x="430" y="310" text-anchor="middle" dominant-baseline="central">Brand active?</text></g>
<line class="arr" x1="310" y1="310" x2="244" y2="310" marker-end="url(#a)"/>
<text class="ts" x="277" y="300" text-anchor="middle">Disabled</text>
<g class="box"><rect x="40" y="288" width="200" height="44" rx="8" stroke-width="0.8"/>
<text class="t" x="140" y="310" text-anchor="middle" dominant-baseline="central">403 brand disabled</text></g>
<line class="arr" x1="430" y1="332" x2="430" y2="360" marker-end="url(#a)"/>
<text class="ts" x="440" y="351">Active</text>
<g class="teal"><rect x="310" y="364" width="240" height="56" rx="8" stroke-width="0.8"/>
<text class="t" x="430" y="384" text-anchor="middle" dominant-baseline="central">Store brand in context</text>
<text class="ts" x="430" y="402" text-anchor="middle" dominant-baseline="central">CLS: currentTenant = cr7</text></g>
<line class="arr" x1="430" y1="420" x2="430" y2="446" marker-end="url(#a)"/>
<g class="teal"><rect x="310" y="450" width="240" height="56" rx="8" stroke-width="0.8"/>
<text class="t" x="430" y="470" text-anchor="middle" dominant-baseline="central">Repositories use TenantDb</text>
<text class="ts" x="430" y="488" text-anchor="middle" dominant-baseline="central">Reads and writes go to DB cr7</text></g>
<text class="ts" x="40" y="390">Jobs and CLI commands set</text>
<text class="ts" x="40" y="408">the brand with tenantContext.run()</text>
<text class="ts" x="40" y="470">Outside a request or run(),</text>
<text class="ts" x="40" y="488">TenantDb throws instead of guessing</text>
</svg>
