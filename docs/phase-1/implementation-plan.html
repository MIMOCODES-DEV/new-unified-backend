<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Implementation Plan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg: #EEF1F4; --panel: #FAFBFC; --fg: #16202B; --muted: #5A6674; --line: #D3DAE1;
  --accent: #C4561C; --accent-soft: #F6E3D7; --ok: #2E7D4F; --ok-soft: #DDEFE4; --warn-soft: #F7E9CF;
  --ali: #2F6FB5; --ali-soft: #DCE8F6; --omar: #7A4FB0; --omar-soft: #EBE2F6; --merge: #2E7D4F;
  --font-display: 'Familjen Grotesk', 'Segoe UI', Arial, sans-serif;
  --font-body: 'Instrument Sans', 'Segoe UI', Arial, sans-serif;
  --font-mono: 'JetBrains Mono', Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F151C; --panel: #151D26; --fg: #E6EBF0; --muted: #93A0AE; --line: #25303C;
    --accent: #F08A4B; --accent-soft: #3A2516; --ok: #6CC791; --ok-soft: #173326; --warn-soft: #3A2C12;
    --ali: #6FA8E8; --ali-soft: #142538; --omar: #B793E6; --omar-soft: #261B36; --merge: #6CC791; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F151C; --panel: #151D26; --fg: #E6EBF0; --muted: #93A0AE; --line: #25303C;
  --accent: #F08A4B; --accent-soft: #3A2516; --ok: #6CC791; --ok-soft: #173326; --warn-soft: #3A2C12;
  --ali: #6FA8E8; --ali-soft: #142538; --omar: #B793E6; --omar-soft: #261B36; --merge: #6CC791; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
button { font: inherit; color: inherit; }
code { font-family: var(--font-mono); font-size: 12px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }

header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 20px 0 16px; }
h1 { font-family: var(--font-display); font-size: 28px; margin: 0 0 2px; }
.sub { color: var(--muted); margin: 0 0 14px; }
.flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 14px; font-size: 14px; }
.flow span { border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; background: var(--bg); }
.flow i { color: var(--muted); font-style: normal; }
.progress { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.prog { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.prog .top { display: flex; justify-content: space-between; font-weight: 600; }
.prog .top span:last-child { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-weight: 400; }
.bar { height: 8px; border-radius: 99px; background: var(--line); margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--ok); }
.prog.ali .bar i { background: var(--ali); } .prog.omar .bar i { background: var(--omar); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
.btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

.lanes-head { position: sticky; top: 0; z-index: 3; background: var(--bg); border-bottom: 1px solid var(--line); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.lanes-head .cols > div { padding: 10px 0; font-family: var(--font-display); font-weight: 700; font-size: 17px; }
.lanes-head .ali { color: var(--ali); } .lanes-head .omar { color: var(--omar); }

.round { padding: 18px 0 8px; }
.round > h2 { font-family: var(--font-display); font-size: 20px; margin: 0 0 2px; }
.round > p { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
.lane { display: grid; gap: 12px; align-content: start; min-width: 0; }
.span { grid-column: 1 / -1; }
.idle { border: 1px dashed var(--line); border-radius: 12px; padding: 12px; color: var(--muted); font-size: 13px; }

.feat { background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--line); border-radius: 12px; overflow: hidden; }
.feat.ali { border-top-color: var(--ali); } .feat.omar { border-top-color: var(--omar); } .feat.both { border-top-color: var(--accent); }
.feat.is-done { opacity: .7; }
.waitbar { background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 600; padding: 8px 14px; border-bottom: 1px solid var(--line); }
.fhead { padding: 12px 14px 0; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.fname { font-family: var(--font-display); font-weight: 700; font-size: 18px; flex: 1 1 auto; }
.who { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
.who.ali { background: var(--ali-soft); color: var(--ali); } .who.omar { background: var(--omar-soft); color: var(--omar); } .who.both { background: var(--accent-soft); color: var(--accent); }
.st { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
.st.done { background: var(--ok-soft); color: var(--ok); }
.st.ready { background: var(--ok-soft); color: var(--ok); }
.st.prog { background: var(--warn-soft); color: var(--fg); }
.st.wait { background: var(--accent-soft); color: var(--accent); }
.fbody { padding: 6px 14px 12px; }
.fdesc { color: var(--muted); font-size: 14px; margin: 0; }
.branch { font-size: 12px; color: var(--muted); margin-top: 6px; }
.needs { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.chip { border-radius: 999px; padding: 1px 9px; font-weight: 600; font-size: 12px; border: 1px solid var(--line); color: var(--fg); background: var(--bg); }
.chip.other { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.chip.done { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
.fprog { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
.fprog .bar { flex: 1; margin: 0; height: 6px; }
.donewhen { margin-top: 10px; font-size: 14px; border-left: 3px solid var(--merge); padding: 4px 10px; background: var(--bg); border-radius: 0 6px 6px 0; }
.donewhen b { color: var(--merge); }
details.tasks { margin-top: 10px; }
details.tasks > summary { cursor: pointer; font-weight: 600; font-size: 14px; }
ul.tl { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.task { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); }
.task .r { display: flex; gap: 10px; align-items: flex-start; }
.task input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--ok); flex: none; cursor: pointer; }
.task .tt { font-weight: 600; flex: 1; }
.task .tid { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.task .td { color: var(--muted); font-size: 13px; margin: 2px 0 0 28px; }
.task .tw { margin: 4px 0 0 28px; font-size: 12px; font-weight: 600; color: var(--accent); }
.task details { margin: 4px 0 0 28px; font-size: 13px; }
.task details summary { cursor: pointer; color: var(--muted); }
.task details ul { margin: 4px 0 0; padding-left: 18px; }
.task.is-done .tt { text-decoration: line-through; color: var(--muted); }
.merge { font-size: 12px; color: var(--muted); margin-top: 10px; }

.mp { margin: 14px 0 4px; border: 2px solid var(--merge); border-radius: 12px; padding: 12px 14px; background: var(--ok-soft); }
.mp h3 { margin: 0 0 4px; font-family: var(--font-display); font-size: 17px; color: var(--merge); }
.mp p { margin: 0; font-size: 14px; }
.mp .fl { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
.donebox { margin: 14px 0 0; }
.donebox summary { cursor: pointer; font-weight: 600; }
.donebox ul { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
body.hide-done .feat.is-done { display: none; }

@media (max-width: 760px) {
  .cols { grid-template-columns: 1fr; }
  .lanes-head { display: none; }
  .progress { grid-template-columns: 1fr; }
  h1 { font-size: 23px; }
  .lane[data-empty="1"] { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Implementation Plan · Phase 1 · Device core</h1>
    <p class="sub" id="sub"></p>
    <div class="flow" aria-label="How the work flows">
      <span>1 · Initial tasks</span><i>→</i><span>2 · Features, one branch each</span><i>→</i><span>Merge points: merge and test together</span><i>→</i><span>3 · Launch</span>
    </div>
    <div class="progress">
      <div class="prog ali"><div class="top"><span>Ali</span><span id="pa"></span></div><div class="bar"><i id="ba"></i></div></div>
      <div class="prog omar"><div class="top"><span>Omar</span><span id="po"></span></div><div class="bar"><i id="bo"></i></div></div>
    </div>
    <p class="sub">The schema: <a href="database-schema.html" style="color:inherit">Phase 1 database schema</a> · everything in words: <a href="README.md" style="color:inherit">README.md</a>.</p>
    <div class="tools">
      <button type="button" class="btn" id="hide-done" aria-pressed="false">Hide finished features</button>
      <button type="button" class="btn" id="reset">Reset ticks</button>
    </div>
  </div>
</header>

<div class="lanes-head"><div class="wrap cols"><div class="ali">Ali</div><div class="omar">Omar</div></div></div>

<main class="wrap">
  <details class="donebox" id="donebox"></details>
  <div id="plan"></div>
</main>

<script>
// Phase 1, the device core: devices, licensing, playlists, recovery and domain-migrations, as listed in the Unified
// Backend Tour, built on the schema agreed on 21 and 25 Oct (Old Database Map: Device, SuspectDevice, PlayList,
// RecaptchaToken, DomainMigration). Everything else comes in a later phase.
const MASTER = 'b2ac73a';
const UPDATED = '26 Oct 2026';

const TASKS = [
  ['SET', 'both', 1, 'Project skeleton', 'NestJS on Fastify, config, logging, MongoDB pool and migration runner, Redis, jobs and CI.', [], []],
  ['TEN-1', 'omar', 1, 'Brands and hosts', 'Each request finds its brand from the host name and gets that brand\'s database; unknown hosts are refused.', [], []],
  ['TEN-4', 'omar', 1, 'Brand secrets (encrypted)', 'Keys per brand stored encrypted (the key for playlist pinEnc goes here).', ['TEN-1'], []],
  ['TEN-5', 'omar', 1, 'Brand settings and config', 'trial.days (default 7), app.demoUrl, playlistProfile xc / general, rawPlaylistsForAndroid44 and the other per-brand flags.', ['TEN-1'], []],
  ['TEN-7', 'omar', 1, 'Brand isolation tests', 'Proves one brand can never read or write another brand.', ['TEN-1'], []],
  ['DEC-1', 'both', 1, 'Device core schema agreed', 'trialDevices + devices + licenses, one playlists collection, no encryption for url or Xtream password (21 and 25 Oct, Old Database Map).', [], []],

  ['SCH-1', 'ali', 1, 'Create the Phase 1 collections', 'Exactly as in the Phase 1 database schema: per brand trialDevices, devices, licenses, playlists and captchas (pnpm migrate:tenants); central domainMigrations (pnpm migrate:central). Each gets a migration with a validator and its indexes, plus TypeScript types and zod schemas next to it. In the same branch, bring PLAN.md §5–6, docs/TASKS.md and docs/ARCHITECTURE.md in line (they still describe pendingDevices and encrypted playlist passwords).', ['DEC-1', 'TEN-1'], [
    'pnpm migrate:tenants creates the five brand collections on every brand database and pnpm migrate:central creates domainMigrations; every field name and type matches the schema.',
    'Indexes: macAddress and appDeviceId unique within each device collection (deviceKey is not unique and needs no index: login finds the device by MAC); licenses deviceId, and deviceId + sourceId unique; playlists.deviceId; one unique key per device so the same playlist is not saved twice (url + username, or portal + MAC, or code); captchas token unique and expiresAt TTL; domainMigrations fromHost + toHost unique.',
    'stalkerEnabled is a field on both device collections (decided 25 Oct).',
    'grep -ri pendingDevices PLAN.md docs/ returns nothing.',
    'Reviewed by Omar; merged.']],
  ['SCH-2', 'ali', 1, 'Data access for the Phase 1 collections', 'One repository per collection that Phase 1 uses instead of the driver. Brand repositories open only through the request\'s brand, so code cannot reach another brand\'s database by mistake; domainMigrations uses the central database.', ['SCH-1', 'TEN-7'], [
    'Typed repositories for trialDevices, devices, licenses, playlists, captchas and domainMigrations.',
    'A repository cannot be built without a brand context; an integration test with two brands proves no cross-brand reads or writes.',
    'Look up by old id (legacy.id) works, for the data move later.',
    'Reviewed by Omar; merged.']],
  ['LOCK', 'ali', 1, 'Redis lock helper', 'RedisLock.withLock(key, { ttlMs }, fn) in src/shared/redis/redis-lock.ts: SET NX PX with a random token, released by a compare-and-delete script. Needed for one MAC, one device (UNQ), activation, MAC switch and recovery.', ['SET'], [
    'A second caller cannot take a lock that is held; different keys run in parallel.',
    'Locks expire after their TTL and are released when the work throws; a late release never deletes someone else\'s lock.',
    'If Redis is down the lock is refused (fails closed).',
    'Integration tests against a real Redis pass in CI; reviewed by Omar; merged.']],
  ['UNQ', 'ali', 1, 'One MAC, one device', 'The schema says a MAC can be in only one of trialDevices or devices: one TV is one device. The device key is not unique. A MongoDB index cannot span two collections, so one helper takes the Redis lock for the MAC before it creates a device, moves it to devices or switches its MAC. Only trialDevices and devices; no extra collection.', ['SCH-2', 'LOCK'], [
    'Parallel sign-ups with the same MAC create exactly one device.',
    'Moving a device from trialDevices to devices keeps its id, MAC and device key; a move stopped halfway and run again ends in devices only, and lookups check devices first.',
    'With Redis down an existing device is still found; creating a new one is refused with a clear error.',
    'Reviewed by Omar; merged.']],

  ['DEV-1', 'omar', 2, 'Register and find a device', 'An unknown device gets a trial in trialDevices; a known one is found again in either collection.', ['UNQ', 'TEN-5'], [
    'An unknown MAC creates a trialDevices row: new UUID, a new 6-digit device key, trialStartedAt now, trialEndsAt = end of day UTC after trial.days from brand config.',
    'A device that ended its trial stays in trialDevices and never gets a second trial.',
    'lastSeenAt, ip, appVersion and apiVersion are updated on each visit.',
    'Unit and integration tests pass.']],
  ['DEV-2', 'omar', 2, 'Devices without a usable MAC', 'Random MAC from app_device_id, and fallback MACs treated as no MAC.', ['DEV-1'], [
    'A device with no MAC gets one made from appDeviceId and is found again by appDeviceId.',
    '52:54:00:12:34:57, …:58, …:59 and the Windows fallback never create or match a shared device; such devices are found by appDeviceId or uid instead.',
    'A test for each fallback MAC.']],
  ['DEV-3', 'omar', 2, 'One device for IBO Player, Pro and TV; wrong app type', 'The three IBO apps share one device per MAC, and rows saved under the wrong app type (platform) are merged.', ['DEV-1'], [
    'IBO Player, Pro and Player TV with the same MAC get the same device; appVersion records the one that called last.',
    'Two old rows for one device under different platforms are merged into one, keeping the paid one; a test covers it.']],
  ['DEV-4', 'omar', 2, 'u_id and captcha registration (V4)', 'V4 apps send a u_id and register with a captcha; a u_id that does not match asks for the recovery captcha. Uses the captchas collection: unanswered ones expire, solved ones are kept for their MAC.', ['DEV-1'], [
    'A V4 captcha is issued, expires if unanswered, and can be answered once.',
    'A solved captcha lets the device skip the next one; the quasi-V4 apps (CRPlayer) send the same solved code on every start and it keeps working.',
    'A u_id that does not match the stored uid asks for the recovery captcha; solving it updates uid.']],
  ['DEV-5', 'omar', 2, 'Device key and parent PIN', '6-digit device key for website login; parent PIN for the apps.', ['DEV-1'], [
    'A new device key is 6 random digits; it does not have to be unique, because it is always checked together with the MAC.',
    'The device key can be changed; the old one stops working.',
    'parentPin can be set and changed and is returned as entered (the apps check it themselves).']],
  ['DEV-6', 'omar', 2, 'V4 lock and store-review builds', 'A device on V4 is refused by old routes; and a lifetime reply for a store review build.', ['DEV-1', 'TEN-5'], [
    'A device whose apiVersion is v4 is refused by the old (legacy) entry points, as today.',
    'Store review: ibo and bob reply lifetime (expire 2440-12-12) when a testing flag is on and a Samsung / LG app sends a review-build version. The flags are hard-coded off today. Replace them with a per-brand list of review builds (platform + version) in brand config, empty by default.']],

  ['LIC-1', 'omar', 2, 'License rules', 'One licenses row per license; the device points to its current one. The state is worked out, not stored as a number like the old is_trial 0–3.', ['SCH-2'], [
    'State of a device: trial, yearly, lifetime, expired or revoked, from trialEndsAt or its current license (type, expiresAt, revoked).',
    'A yearly license bought before the current one ends adds its year to that end date (stacking); lifetime has no expiresAt.',
    'creditCost is 1 for yearly and 2 for lifetime; multiActivate is stored on the license.',
    'A unit test for every rule.']],
  ['LIC-2', 'omar', 2, 'Activate from any source', 'One use case activates a device whatever paid: reseller, code, coupon, payment, store, transfer, admin or plan. The source is only recorded here; the sources themselves come later.', ['LIC-1', 'DEV-1', 'UNQ'], [
    'Activation writes a licenses row with type, expiresAt, activatedBy, creditCost, multiActivate and sourceId.',
    'A trial device moves to devices with the same id, MAC and device key; currentLicenseId and activatedAt are set.',
    'Activating twice with the same sourceId does nothing the second time.',
    'Runs under the Redis lock for that device.']],
  ['LIC-3', 'omar', 2, 'Revoke, expiry and history', 'Revoke keeps the row; history shows who activated what.', ['LIC-2'], [
    'A license can be revoked (revoked, revokedAt); the device stays in devices with no valid license.',
    'Expired is worked out from expiresAt, never stored.',
    'A device\'s full license history is listed with activatedBy for each row.']],
  ['LIC-4', 'omar', 0, 'Expiry and cleanup of old devices', 'The old cleanup jobs used wrong keys and left orphan playlists. Rebuild it on the new collections.', ['LIC-3', 'PL-2'], [
    'The rule for trial devices that ended and never added a playlist (playlistCount 0) is agreed and written down.',
    'devices are never deleted; a cleaned trial device takes its playlists with it (by deviceId).',
    'The job has a dry-run mode and writes a report; it runs once across all servers.']],

  ['PL-1', 'ali', 2, 'Playlist kinds and storage', 'M3U, Xtream, Stalker portal and code in one playlists collection; only the part for the type is filled.', ['SCH-2', 'DEV-1'], [
    'Saving an Xtream link parses it once into xtream { server, username, password }; url is kept exactly as typed.',
    'Each type fills only its own part (url, xtream, stalker or code); a test per type.',
    'url and the Xtream password are stored as plain text.']],
  ['PL-2', 'ali', 2, 'Add, edit, delete and bulk sync', 'Everything the app, website, store and admin do with playlists, through one service.', ['PL-1'], [
    'Add, edit, delete and list by device; addedBy records app, website, store or admin.',
    'Bulk sync by MAC (update_playlist) adds new ones, returns new ids next to the app\'s origin ids, removes remove_ids, and only touches the calling device\'s playlists.',
    'playlistCount and firstPlaylistAt on trialDevices change with add and delete (firstPlaylistAt never clears).',
    'No limit on playlists per device.']],
  ['PL-3', 'ali', 2, 'PIN protection per playlist', 'A protected playlist needs its PIN; the PIN is encrypted, not hashed, because Roku and iOS replies send it to the app.', ['PL-2', 'TEN-4'], [
    'protected + pinEnc are set and changed; pinEnc uses the brand key from secrets.',
    'The PIN hides a protected playlist\'s data on the website dashboard: the dashboard needs it to show, change or delete it; the device\'s own app never does (decided 26 Oct).']],
  ['PL-4', 'ali', 2, 'Reply shaping, demo playlist and provider branding', 'Build the Xtream, general or raw reply each brand and app expects from one playlist row.', ['PL-2', 'TEN-5'], [
    'One URL parser replaces the old ones, with tests.',
    'The reply follows the brand\'s playlistProfile (xc or general); Android 4.4 gets raw playlists when rawPlaylistsForAndroid44 is on.',
    'A device with no playlist of its own gets the demo playlist from app.demoUrl (brand config, not a row).',
    'provider { name, logo, whatsapp, email } is returned with the playlist.']],
  ['PL-5', 'ali', 2, 'Backup URLs', 'Up to 8 backup hosts per playlist (cr Android apps).', ['PL-2'], [
    'backup { enabled, hosts[] } holds up to 8 hosts; turning it off keeps the hosts.',
    'Replies include the backup hosts in the shape cr gives today.']],
  ['PL-6', 'ali', 2, 'Add without login and by MAC only', 'The website QR pages and the Stalker form add a playlist without logging in; cr also adds and deletes by MAC alone.', ['PL-2'], [
    'Add by QR code and by the Stalker form works for a known MAC without a login.',
    'Add and delete by MAC only work as on cr, rate limited per IP.']],
  ['PL-7', 'ali', 2, 'Playlist status sync and code playlists', 'CRPlayer and BobPlayer report a playlist\'s status and expiry (edit_playlist).', ['PL-2'], [
    'The status sync changes only account { status, expiresAt } (any playlist type, decided 26 Oct; was code.status and code.expiresAt); any other field sent is ignored.',
    'A test with a request that also sends url or name shows they are not changed.']],
  ['PL-8', 'ali', 2, 'Bulk provider domain rewrite', 'The store changes a provider\'s domain in all playlists at once.', ['PL-2'], [
    'The rewrite touches only the calling brand and treats the domain as plain text, not a pattern.',
    'It reports how many playlists changed; a count-only mode changes nothing.']],

  ['DEV-7', 'ali', 0, 'MAC switch', 'Move a paid device\'s license to a new MAC.', ['LIC-2', 'UNQ'], [
    'The device moves to the new MAC, keeping its id, license and playlists; switch records from, to and when.',
    'Refused when the current license has multiActivate.',
    'Refused when the new MAC already belongs to a paid device.']],
  ['REC-1', 'ali', 0, 'Recovery code', 'Generate a recovery code on the website (ibo, cr) so a paid device can be moved to a new TV.', ['LIC-2'], [
    'Only a device in devices (paid) gets a code; it is stored in recovery { code, expiresAt, enabled } and lasts 30 minutes.',
    'A new code replaces the old one; a trial device is refused.']],
  ['REC-2', 'ali', 0, 'Apply the code on a new TV', 'The new TV (V4 apps) sends the code and gets the paid device.', ['REC-1', 'UNQ'], [
    'The paid device takes the new TV\'s MAC and keeps its id, license and playlists; recovery records recoveredFrom (the old MAC) and recoveredAt.',
    'A code works once; an expired or wrong code is refused.',
    'Runs under the Redis lock for both MACs.']],
  ['REC-3', 'ali', 0, 'Retire what is left after recovery', 'The old backends never purged after a recovery. Nothing may be left behind.', ['REC-2'], [
    'The new TV\'s own trial row, if it had one, is removed with its playlists (by deviceId).',
    'After a recovery each MAC belongs to exactly one device; a test proves there are no leftovers.']],
  ['DOM-1', 'ali', 0, 'Learn provider host moves', 'When an IPTV provider moves, devices report the new host (cr); learn the move from paid devices only.', ['SCH-2', 'LIC-2'], [
    'The first report of fromHost → toHost creates a pending domainMigrations row; later reports add confirmations.',
    'Only paid devices count, and only one confirmation per IP (ipHash); trial devices are ignored.',
    'After 3 confirmations from different IPs the move shows up for approval; it is not served yet.',
    'Hosts are stored lowercase with the port; a test per rule.']],
  ['DOM-2', 'ali', 0, 'Approve a move before it is served', 'A staff member approves or blocks a learned move; only approved moves change what devices get.', ['DOM-1', 'PL-4'], [
    'Approve and block set status, decidedBy and decidedAt (a CLI command until the admin API exists).',
    'Playlist replies swap fromHost for toHost only for approved moves; stored playlists are not changed.',
    'A blocked move is never served, however many confirmations it gets.']],
  ['CORE', 'both', 0, 'Device core end to end', 'Both of you test the whole of Phase 1 on master together.', ['DEV-7', 'LIC-4', 'PL-4', 'PL-8', 'REC-3', 'DOM-2'], [
    'On a test brand: register a device, add playlists, activate it, extend it, switch its MAC, recover it on a new TV, revoke it, and see the right state and replies at each step.',
    'A provider move reported by paid devices is approved and then served in playlist replies.',
    'The same run on a second brand shows nothing crosses between brands.']]
].map(([id, who, done, title, desc, deps, ac], order) => ({ id, who, base: done === 1, review: done === 2, title, desc, deps, ac, order }));

// Work units. 'init' = initial tasks, finished before feature work. Every feature is one branch, merged when "Done when" holds.
const FEATURES = [
  { id: 'init-ali', who: 'ali', kind: 'init', name: 'Initial tasks', desc: 'Turn the agreed Phase 1 schema into code: the six collections, their data access, and the one-MAC rule across both device collections.', tasks: ['SCH-1', 'SCH-2', 'LOCK', 'UNQ'], doneWhen: 'The six collections exist with their indexes and repositories; a MAC can only be in one device collection.' },

  { id: 'devices', who: 'omar', name: 'Devices', branch: 'feature/devices', desc: 'Who the device is, and how it registers and logs in.', tasks: ['DEV-1', 'DEV-2', 'DEV-3', 'DEV-4', 'DEV-5', 'DEV-6'], doneWhen: 'A new device on any app gets a trial and comes back as the same device; fallback MACs never merge devices; V4 devices register with a captcha.' },
  { id: 'licensing', who: 'omar', name: 'Licensing', branch: 'feature/licensing', desc: 'What the device is allowed to do, and until when.', tasks: ['LIC-1', 'LIC-2', 'LIC-3'], doneWhen: 'A device can be activated from any source, extended and revoked, and its license history listed.' },
  { id: 'playlists', who: 'ali', name: 'Playlists', branch: 'feature/playlists', desc: 'The lists of channels each device plays.', tasks: ['PL-1', 'PL-2', 'PL-3', 'PL-4', 'PL-5', 'PL-6', 'PL-7', 'PL-8'], doneWhen: 'A device can add, edit, delete, protect and sync playlists and gets them in its brand\'s reply format.' },
  { id: 'switch', who: 'ali', name: 'MAC switch', branch: 'feature/mac-switch', desc: 'Move a paid license to a new MAC (part of devices, but it needs licensing first).', tasks: ['DEV-7'], doneWhen: 'A paid device moves to a new MAC with its license and playlists; multiActivate licenses are refused.' },
  { id: 'cleanup', who: 'omar', name: 'Expiry and cleanup', branch: 'feature/license-cleanup', desc: 'Old trial devices cleaned up safely, with their playlists.', tasks: ['LIC-4'], doneWhen: 'A dry run on sample data gives a report both of you agree with.' },
  { id: 'recovery', who: 'ali', name: 'Recovery', branch: 'feature/recovery', desc: 'Getting a paid device back on a new TV.', tasks: ['REC-1', 'REC-2', 'REC-3'], doneWhen: 'A code made on the website moves a paid device to a new TV with its license and playlists, and nothing is left behind.' },
  { id: 'domains', who: 'ali', name: 'Provider domain moves', branch: 'feature/domain-moves', desc: 'Following IPTV providers when they move their server.', tasks: ['DOM-1', 'DOM-2'], doneWhen: 'A move reported by paid devices on different IPs is served only after it is approved.' },
  { id: 'launch', who: 'both', kind: 'launch', name: 'Device core done', desc: 'Test the whole device core together on master.', tasks: ['CORE'], doneWhen: 'The end-to-end run passes on two brands.' }
];

// Moments where both of you merge to master and test together before going on.
const MERGE_POINTS = [
  { name: 'Devices and licenses work', features: ['devices', 'licensing'], test: 'On master: register a device, activate it from two different sources, extend it and revoke it.' },
  { name: 'Device core works', features: ['playlists', 'switch', 'cleanup', 'recovery', 'domains'], test: 'On master: add and sync playlists, switch the MAC of a paid device, recover it on a new TV, approve a provider move, and dry-run the cleanup.' }
];

// Branch for each initial task (features carry their own branch).
const TASK_BRANCH = { 'SCH-1': 'feat/schema-device-core', 'SCH-2': 'feat/device-core-repositories', 'LOCK': 'feat/redis-lock', 'UNQ': 'feat/device-identity-unique' };

const BY = Object.fromEntries(TASKS.map((t) => [t.id, t]));
const FEAT_OF = {};
FEATURES.forEach((f) => f.tasks.forEach((id) => { FEAT_OF[id] = f.id; }));
const FB = Object.fromEntries(FEATURES.map((f) => [f.id, f]));
const NAMES = { ali: 'Ali', omar: 'Omar', both: 'Both' };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = (s) => document.querySelector(s);

// A feature needs another feature when one of its tasks needs one of that feature's tasks.
FEATURES.forEach((f) => {
  const need = new Set();
  f.tasks.forEach((id) => BY[id].deps.forEach((d) => { const g = FEAT_OF[d]; if (g && g !== f.id) need.add(g); }));
  f.needs = [...need];
});
// Round = 1 + the latest round of what it needs; initial tasks are round 0.
const ROUND = {};
const roundOf = (id) => {
  if (id in ROUND) return ROUND[id];
  const f = FB[id];
  ROUND[id] = 0;
  return (ROUND[id] = f.kind === 'init' ? 0 : 1 + Math.max(0, ...f.needs.map(roundOf)));
};
FEATURES.forEach((f) => roundOf(f.id));
// Features marked 'later' wait until the last feature round, whatever they need.
const LAST = Math.max(...FEATURES.filter((f) => !f.later && f.kind !== 'launch').map((f) => ROUND[f.id]));
FEATURES.filter((f) => f.later).forEach((f) => { ROUND[f.id] = Math.max(ROUND[f.id], LAST); });
FEATURES.filter((f) => f.kind === 'launch').forEach((f) => { ROUND[f.id] = Math.max(ROUND[f.id], ...FEATURES.filter((g) => g !== f).map((g) => ROUND[g.id] + 1)); });
const MAXR = Math.max(...FEATURES.map((f) => ROUND[f.id]));

// Ticks are remembered in this browser only.
const KEY = 'implementation-plan-done-v1';
let ticks = {};
try { ticks = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { ticks = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ticks)); } catch (e) { /* storage blocked */ } };
// Done = ticked here, on master (flag 1), or finished on a branch and in review (flag 2).
const isDone = (id) => (id in ticks ? ticks[id] : BY[id].base || BY[id].review);
const featDone = (f) => f.tasks.every(isDone);
const featCount = (f) => f.tasks.filter(isDone).length;

function status(f) {
  if (featDone(f)) return f.tasks.some((id) => BY[id].review) ? ['done', '✓ Done · in review'] : ['done', '✓ Merged'];
  const waiting = f.needs.filter((n) => !featDone(FB[n]));
  if (featCount(f)) return ['prog', 'In progress'];
  if (f.kind === 'init' && f.tasks.some((id) => BY[id].deps.every(isDone))) return ['ready', 'Ready to start'];
  if (!waiting.length) return ['ready', 'Ready to start'];
  return ['wait', 'Waiting'];
}

function taskHtml(t, f) {
  const other = t.deps.filter((d) => !isDone(d) && BY[d].who !== f.who && f.who !== 'both' && FEAT_OF[d] !== f.id);
  return `<li class="task${isDone(t.id) ? ' is-done' : ''}"><div class="r"><input type="checkbox" data-tick="${t.id}" ${isDone(t.id) ? 'checked' : ''} aria-label="Mark ${esc(t.title)} as done">` +
    `<span class="tt">${esc(t.title)}</span><span class="tid">${esc(t.id)}</span>${t.review ? '<span class="tid">on branch, in review</span>' : ''}</div>` +
    `<div class="td">${esc(t.desc)}</div>` +
    (TASK_BRANCH[t.id] ? `<div class="td">Branch <code>${esc(TASK_BRANCH[t.id])}</code></div>` : '') +
    (other.length && !isDone(t.id) ? `<div class="tw">⏳ needs ${other.map((d) => `${NAMES[BY[d].who]}: ${esc(BY[d].title)}`).join(', ')}</div>` : '') +
    `<details><summary>Acceptance criteria</summary><ul>${t.ac.map((a) => `<li>${esc(a)}</li>`).join('')}</ul></details></li>`;
}

function featHtml(f) {
  const [sk, sl] = status(f);
  // Initial tasks show waits on the single task that has one, not as a bar over the whole card.
  const waitingOther = f.kind === 'init' ? [] : f.needs.filter((n) => !featDone(FB[n]) && FB[n].who !== f.who && f.who !== 'both');
  const n = featCount(f), total = f.tasks.length;
  const reviewer = f.who === 'ali' ? 'Omar' : f.who === 'omar' ? 'Ali' : 'each other';
  return `<article class="feat ${f.who}${sk === 'done' ? ' is-done' : ''}" id="f-${f.id}">` +
    (waitingOther.length && sk !== 'done' ? `<div class="waitbar">⏳ Waits for ${waitingOther.map((x) => `${NAMES[FB[x].who]}: ${esc(FB[x].name)}`).join(' · ')}</div>` : '') +
    `<div class="fhead"><span class="fname">${esc(f.name)}</span><span class="who ${f.who}">${NAMES[f.who]}</span><span class="st ${sk}">${sl}</span></div>` +
    `<div class="fbody"><p class="fdesc">${esc(f.desc)}</p>` +
    (f.branch ? `<div class="branch">Branch <code>${esc(f.branch)}</code></div>` : '') +
    (f.needs.length && f.kind !== 'init' ? `<div class="needs">Starts after${f.needs.map((x) => `<span class="chip${featDone(FB[x]) ? ' done' : FB[x].who !== f.who && f.who !== 'both' ? ' other' : ''}">${featDone(FB[x]) ? '✓ ' : ''}${esc(FB[x].name)}${FB[x].who !== f.who ? ' · ' + NAMES[FB[x].who] : ''}</span>`).join('')}</div>` : '') +
    `<div class="fprog"><span>${n}/${total} tasks</span><div class="bar"><i style="width:${Math.round((n / total) * 100)}%"></i></div></div>` +
    `<div class="donewhen"><b>Done when:</b> ${esc(f.doneWhen)}</div>` +
    `<details class="tasks"${f.kind === 'init' || sk === 'prog' ? ' open' : ''}><summary>Tasks (${total})</summary><ul class="tl">${f.tasks.map((id) => taskHtml(BY[id], f)).join('')}</ul></details>` +
    (f.branch ? `<div class="merge">Merge: <code>${esc(f.branch)}</code> → review by ${reviewer} → tests and replay green → master</div>` : '') +
    `</div></article>`;
}

function render() {
  const base = TASKS.filter((t) => t.base);
  $('#donebox').innerHTML = `<summary>Already done on master (${base.length})</summary><ul>${base.map((t) => `<li><b>${esc(t.title)}</b> · ${NAMES[t.who]} · ${esc(t.desc)}</li>`).join('')}</ul>`;
  const lastRound = (mp) => Math.max(...mp.features.map((id) => ROUND[id]));
  let h = '';
  for (let r = 0; r <= MAXR; r++) {
    const list = FEATURES.filter((f) => ROUND[f.id] === r);
    if (!list.length) continue;
    const title = r === 0 ? '1 · Initial tasks' : list.some((f) => f.kind === 'launch') && list.length === 1 ? '3 · Launch' : `2 · Features, round ${r}`;
    const lede = r === 0 ? 'Finish these first. They set up what every feature builds on.' : list.some((f) => f.kind === 'launch') && list.length === 1 ? 'After every feature is merged.' : 'Each feature is its own branch. Start one when the features it needs are merged.';
    const lane = (p) => {
      const l = list.filter((f) => f.who === p);
      return `<div class="lane" data-empty="${l.length ? 0 : 1}">${l.length ? l.map(featHtml).join('') : `<div class="idle">Nothing new for ${NAMES[p]} in this round: finish earlier features or review ${p === 'ali' ? 'Omar' : 'Ali'}'s branches.</div>`}</div>`;
    };
    const both = list.filter((f) => f.who === 'both');
    h += `<section class="round"><h2>${title}</h2><p>${lede}</p><div class="cols">` +
      (both.length ? `<div class="lane span">${both.map(featHtml).join('')}</div>` : '') +
      (list.some((f) => f.who !== 'both') ? lane('ali') + lane('omar') : '') + `</div>`;
    MERGE_POINTS.filter((mp) => lastRound(mp) === r).forEach((mp) => {
      const done = mp.features.every((id) => featDone(FB[id]));
      h += `<div class="mp"><h3>${done ? '✓ ' : ''}Merge point · ${esc(mp.name)}</h3><p>${esc(mp.test)}</p><div class="fl">${mp.features.map((id) => `<span class="chip${featDone(FB[id]) ? ' done' : ''}">${featDone(FB[id]) ? '✓ ' : ''}${esc(FB[id].name)} · ${NAMES[FB[id].who]}</span>`).join('')}</div></div>`;
    });
    h += `</section>`;
  }
  $('#plan').innerHTML = h;
  for (const [p, a, b] of [['ali', '#pa', '#ba'], ['omar', '#po', '#bo']]) {
    const mine = FEATURES.filter((f) => f.who === p);
    const d = mine.filter(featDone).length;
    $(a).textContent = `${d} of ${mine.length} done`;
    $(b).style.width = Math.round((d / mine.length) * 100) + '%';
  }
  const open = TASKS.filter((t) => !t.base);
  $('#sub').textContent = `Initial tasks first, then ${FEATURES.filter((f) => !f.kind).length} features (one branch each), then a test of the whole device core. ${open.filter((t) => isDone(t.id)).length} of ${open.length} tasks ticked. Phase 1: devices, licensing, playlists, recovery and provider domain moves, from the Unified Backend Tour and the agreed schema; built from master ${MASTER} on ${UPDATED}.`;
}

document.addEventListener('change', (e) => {
  const id = e.target.dataset && e.target.dataset.tick;
  if (!id) return;
  ticks[id] = e.target.checked;
  save();
  const y = window.scrollY;
  const open = [...document.querySelectorAll('details.tasks[open]')].map((d) => d.closest('.feat').id);
  render();
  open.forEach((fid) => { const el = document.querySelector(`#${fid} details.tasks`); if (el) el.open = true; });
  window.scrollTo(0, y);
});
$('#hide-done').addEventListener('click', (e) => {
  const on = !document.body.classList.contains('hide-done');
  document.body.classList.toggle('hide-done', on);
  e.currentTarget.setAttribute('aria-pressed', String(on));
});
$('#reset').addEventListener('click', () => {
  if (!confirm('Clear every tick you made in this browser?')) return;
  ticks = {};
  save();
  render();
});
render();
</script>
</body>
</html>
